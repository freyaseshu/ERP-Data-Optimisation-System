{% extends "base.html" %}

{% block page_title %}Database Analyser{% endblock %}

{% block content %}
<div class="row">
    <!-- Query Input Area -->
    <div class="col-xl-12 mb-4">
        <div class="card shadow">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">SQL Query Analyser</h6>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="predefinedQuery" class="form-label">Predefined Queries</label>
                    <select class="form-select" id="predefinedQuery">
                        <option value="">-- Select a predefined query --</option>
                        {% for q in predefined_queries %}
                            <option value="{{ q.query }}">{{ q.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="sqlQuery" class="form-label">Custom SELECT Query</label>
                    <textarea class="form-control font-monospace" id="sqlQuery" rows="5" placeholder="Enter SELECT query here..."></textarea>
                </div>
                
                <button id="analyseBtn" class="btn btn-primary">
                    <i class="fas fa-play me-1"></i> Analyse Query (EXPLAIN)
                </button>
            </div>
        </div>
    </div>

    <!-- Analysis Results Area -->
    <div class="col-xl-12" id="resultsArea" style="display: none;">
        <!-- Warnings -->
        <div id="warningsContainer" class="mb-4"></div>

        <!-- Execution Plan Table -->
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Execution Plan (EXPLAIN Output)</h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped" id="planTable" width="100%" cellspacing="0">
                        <thead class="table-dark">
                            <tr>
                                <th>id</th>
                                <th>select_type</th>
                                <th>table</th>
                                <th>type</th>
                                <th>possible_keys</th>
                                <th>key</th>
                                <th>key_len</th>
                                <th>ref</th>
                                <th>rows</th>
                                <th>filtered</th>
                                <th>Extra</th>
                            </tr>
                        </thead>
                        <tbody id="planBody">
                            <!-- Results will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const predefinedSelect = document.getElementById('predefinedQuery');
        const sqlTextArea = document.getElementById('sqlQuery');
        const analyseBtn = document.getElementById('analyseBtn');
        const resultsArea = document.getElementById('resultsArea');
        const planBody = document.getElementById('planBody');
        const warningsContainer = document.getElementById('warningsContainer');

        predefinedSelect.addEventListener('change', function() {
            if (this.value) {
                sqlTextArea.value = this.value;
            }
        });

        analyseBtn.addEventListener('click', function() {
            const query = sqlTextArea.value.trim();
            if (!query) {
                alert("Please enter a query.");
                return;
            }

            // Show loading state
            analyseBtn.disabled = true;
            analyseBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Analysing...';

            fetch('{{ url_for("analyser.analyse_query_api") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ query: query })
            })
            .then(response => response.json())
            .then(data => {
                analyseBtn.disabled = false;
                analyseBtn.innerHTML = '<i class="fas fa-play me-1"></i> Analyse Query (EXPLAIN)';
                
                if (data.success) {
                    displayResults(data);
                } else {
                    alert("Error: " + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                analyseBtn.disabled = false;
                analyseBtn.innerHTML = '<i class="fas fa-play me-1"></i> Analyse Query (EXPLAIN)';
                alert("An error occurred during analysis.");
            });
        });

        function displayResults(data) {
            resultsArea.style.display = 'block';
            
            // Render warnings
            warningsContainer.innerHTML = '';
            if (data.warnings && data.warnings.length > 0) {
                data.warnings.forEach(warning => {
                    const alert = document.createElement('div');
                    alert.className = 'alert alert-warning alert-dismissible fade show';
                    alert.innerHTML = `
                        <i class="fas fa-exclamation-triangle me-2"></i> <strong>Warning:</strong> ${warning}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    `;
                    warningsContainer.appendChild(alert);
                });
            } else {
                 const alert = document.createElement('div');
                 alert.className = 'alert alert-success';
                 alert.innerHTML = `<i class="fas fa-check-circle me-2"></i> No obvious issues detected in execution plan.`;
                 warningsContainer.appendChild(alert);
            }

            // Render table
            planBody.innerHTML = '';
            data.plan.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.id || ''}</td>
                    <td>${row.select_type || ''}</td>
                    <td>${row.table || ''}</td>
                    <td><span class="badge ${getAccessTypeClass(row.type)}">${row.type || ''}</span></td>
                    <td>${row.possible_keys || '<em>None</em>'}</td>
                    <td>${row.key || '<em>None</em>'}</td>
                    <td>${row.key_len || ''}</td>
                    <td>${row.ref || ''}</td>
                    <td>${row.rows || ''}</td>
                    <td>${row.filtered || ''}</td>
                    <td>${row.Extra || ''}</td>
                `;
                planBody.appendChild(tr);
            });
        }
        
        function getAccessTypeClass(type) {
            if (!type) return 'bg-secondary';
            const upperType = type.toUpperCase();
            if (upperType === 'ALL') return 'bg-danger';
            if (upperType === 'INDEX') return 'bg-warning text-dark';
            return 'bg-success';
        }
    });
</script>
{% endblock %}
